<!DOCTYPE html>
<html>
<head><title>Spotify Login</title></head>
<body>
<script>
  if (window.location.hash.includes('access_token')) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const token = params.get('access_token');
    if (window.opener) {
      window.opener.postMessage({ type: 'SPOTIFY_TOKEN', token: token }, '*');
      window.close();
    } else {
      document.body.innerHTML = "Token ricevuto, ma la finestra madre non trovata.";
    }
  } else {
    document.body.innerHTML = "In attesa del token...";
  }
</script>
</body>
</html>
